name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Version with Tegami and move v1
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install
        run: nub install --frozen-lockfile

      - name: Version or publish
        run: nub run tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Move the v1 tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --import tsx scripts/move-v1-tag.mts
