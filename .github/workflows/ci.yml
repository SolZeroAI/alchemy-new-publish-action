name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, and check dist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version

      - name: Install
        run: nub ci

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Test
        run: nub run test

      - name: Build dist
        run: nub run build

      - name: Check dist is up to date
        run: git diff --exit-code -- dist

      - name: Dry-run the bundle against a fixture
        run: node scripts/ci-dry-run.mjs

  pack-large:
    name: Pack a large symlink tree
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version

      - name: Install
        run: nub ci

      - name: Pack a tree over 256 MiB uncompressed
        run: node --import tsx scripts/pack-large.mjs
