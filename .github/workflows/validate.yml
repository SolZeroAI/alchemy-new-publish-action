name: Validate

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, format, and check dist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject tracked symlinks
        run: |
          if git ls-files -s | grep '^120000'; then
            echo "Tracked symlinks (mode 120000) are not allowed."
            exit 1
          fi

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install
        run: nub install --frozen-lockfile

      - name: Typecheck
        run: nub run typecheck

      - name: Lint
        run: nub run lint

      - name: Check formatting
        run: nub run format

      - name: Test
        run: nub run test

      - name: Check dist is up to date
        run: nub run check-dist

      - name: Dry-run the bundle against a fixture
        run: node scripts/ci-dry-run.mjs

  pack-large:
    name: Pack a large symlink tree
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: "0.9.6"
          node-version-file: .node-version
          cache-dependency-path: nub.lock

      - name: Install
        run: nub install --frozen-lockfile

      - name: Pack a tree over 256 MiB uncompressed
        run: node --import tsx scripts/pack-large.mjs
