version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
# nub.lock is the lockfile nub writes (pnpm v9 bytes). Dependabot has no nub
# ecosystem, and the npm ecosystem only reads package-lock.json, so dependency
# updates for this repo are not opened automatically.
